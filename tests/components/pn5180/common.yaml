pn5180:
  id: reader
  cs_pin: ${cs_pin}
  busy_pin: ${busy_pin}
  reset_pin: ${reset_pin}
  irq_pin: ${irq_pin}
  on_tag:
    - logger.log:
        format: "Tag %s"
        args: [x.c_str()]
  on_tag_removed:
    - logger.log:
        format: "Tag %s removed"
        args: [x.c_str()]

text_sensor:
  - platform: pn5180
    name: Tag UID
