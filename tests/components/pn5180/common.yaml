pn5180:
  id: reader
  cs_pin: ${cs_pin}
  busy_pin: ${busy_pin}
  reset_pin: ${reset_pin}
  irq_pin: ${irq_pin}
  on_tag:
    - logger.log:
        format: "Tag %s, %s"
        args: [x.c_str(), tag.get_tag_type().c_str()]
  on_tag_removed:
    - logger.log:
        format: "Tag %s removed"
        args: [x.c_str()]

text_sensor:
  - platform: pn5180
    name: Tag UID

binary_sensor:
  - platform: nfc
    nfcc_id: reader
    name: Spool tag
    uid: E0-04-01-08-66-2E-A5-12
